<!doctype html>
<meta charset="utf-8">
<title>SRW4 font editor</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c2027; --line: #2c323c; --ink: #e6e9ef;
    --dim: #8b93a1; --accent: #6ea8fe; --warn: #e0a458; --bad: #e06c75;
    --good: #7bc47f; --lit: #e6e9ef; --unlit: #262b33; --bearing: #1f242c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 13px; margin: 0 12px 0 0; font-weight: 600; letter-spacing: .04em; }
  button { background: #262c36; color: var(--ink); border: 1px solid var(--line);
           border-radius: 5px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #10131a; border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  #dirty { color: var(--warn); margin-left: auto; }
  main { display: grid; grid-template-columns: 260px 1fr 380px; height: calc(100vh - 41px); }
  .col { overflow-y: auto; padding: 12px; }
  .col + .col { border-left: 1px solid var(--line); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
       color: var(--dim); margin: 18px 0 8px; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  input, select, textarea { background: #10131a; color: var(--ink);
       border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
  input:focus, textarea:focus { outline: 1px solid var(--accent); }
  #search { width: 100%; margin-bottom: 8px; }
  #tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  #tabs button { padding: 2px 7px; font-size: 11px; }
  #list { display: flex; flex-wrap: wrap; gap: 4px; }
  .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
          padding: 3px; cursor: pointer; line-height: 0; position: relative; }
  .cell:hover { border-color: var(--accent); }
  .cell.sel { border-color: var(--accent); background: #223047; }
  .cell.hand::after { content: ""; position: absolute; right: 2px; top: 2px;
          width: 4px; height: 4px; border-radius: 50%; background: var(--warn); }
  #gridwrap { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  #side { min-width: 230px; flex: 1; }
  .mini { display: grid; grid-template-columns: repeat(8, 26px); gap: 1px;
          background: var(--line); border: 1px solid var(--line); width: max-content; }
  .mini div { width: 26px; height: 26px; background: #191d24; }
  .mini div.lit { background: #7f8794; }
  .pairwrap { display: flex; gap: 0; align-items: flex-start; }
  .pairwrap .mini { border-left: 0; border-right: 0; }
  .pairlabel { color: var(--dim); font-size: 11px; text-align: center; margin-top: 4px; }
  #grid { display: grid; grid-template-columns: repeat(8, 26px); gap: 1px;
          background: var(--line); border: 1px solid var(--line); width: max-content;
          user-select: none; }
  #grid div { width: 26px; height: 26px; background: var(--unlit); }
  #grid div.bearing { background: var(--bearing); }
  #grid div.lit { background: var(--lit); }
  #grid div.base { background: #3b4453; }
  #grid div.baseline { box-shadow: inset 0 -1px 0 #3a4250; }
  .meta { display: grid; grid-template-columns: auto auto; gap: 4px 10px;
          align-items: center; color: var(--dim); }
  .meta b { color: var(--ink); font-weight: 500; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .previews { display: flex; flex-wrap: wrap; gap: 5px; }
  .pv { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
        padding: 3px; line-height: 0; cursor: pointer; }
  .pv:hover { border-color: var(--accent); }
  .pv.ovr { border-color: var(--warn); }
  .pv.err { border-color: var(--bad); }
  #strip { background: #0c0e12; border: 1px solid var(--line); border-radius: 5px;
           padding: 10px; overflow-x: auto; }
  .note { color: var(--dim); font-size: 11px; margin: 6px 0; }
  .bad { color: var(--bad); } .good { color: var(--good); } .warn { color: var(--warn); }
  #worst button { font-size: 11px; padding: 1px 6px; margin: 0 3px 3px 0; }
  #out { white-space: pre-wrap; color: var(--dim); font-size: 11px; max-height: 140px;
         overflow: auto; }
</style>

<header>
  <h1>SRW4 FONT EDITOR</h1>
  <button id="save">Save</button>
  <button id="revert">Revert</button>
  <button id="rebuild">Rebuild atlas</button>
  <span id="dirty"></span>
</header>

<main>
  <div class="col">
    <input id="search" placeholder="filter…" autocomplete="off">
    <div id="tabs"></div>
    <div id="list"></div>
  </div>

  <div class="col">
    <h2 id="title">—</h2>
    <div id="gridwrap">
      <div class="pairwrap">
        <div><div class="mini" id="pL"></div><div class="pairlabel" id="pLname"></div></div>
        <div><div id="grid"></div><div class="pairlabel" id="pGname"></div></div>
        <div><div class="mini" id="pR"></div><div class="pairlabel" id="pRname"></div></div>
      </div>
      <div id="side">
        <div class="meta" id="metrics"></div>
        <div class="row" id="controls"></div>
        <div class="row">
          <button data-nudge="-1,0">←</button><button data-nudge="1,0">→</button>
          <button data-nudge="0,-1">↑</button><button data-nudge="0,1">↓</button>
          <button id="clear">Clear</button><button id="undo">Undo</button>
        </div>
        <div class="note" id="hint"></div>
      </div>
    </div>

    <h2>Live text</h2>
    <div class="row">
      <input id="text" style="flex:1" value="อากาศ <AiL><AiR>  จิต <SpL><SpR>" autocomplete="off">
      <select id="window"></select>
    </div>
    <div id="strip"></div>
    <div class="note" id="fit"></div>
    <div id="out"></div>
  </div>

  <div class="col">
    <h2>Clusters on this glyph</h2>
    <div class="previews" id="clusters"></div>
    <h2>Override</h2>
    <div id="ovr"></div>
    <h2>Worst from verification</h2>
    <div id="worst"></div>
  </div>
</main>

<script>
const S = { st: null, kind: null, char: null, rows: [], advance: null, dx: 0,
            undo: [], tab: "thai", sel: null };
const ROWS = 16, W = 8;

const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} :
    { method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body) });
  const j = await r.json();
  if (j.error) { note(j.error, "bad"); throw new Error(j.error); }
  return j;
};
const note = (msg, cls) => { const o = $("out"); o.className = cls || ""; o.textContent = msg; };
const $ = id => document.getElementById(id);

/* ---- drawing helpers ---------------------------------------------------- */

function draw(rows, scale, advance, span) {
  const c = document.createElement("canvas");
  c.width = W * scale * (span || 1); c.height = ROWS * scale;
  const g = c.getContext("2d");
  g.fillStyle = "#1c2027"; g.fillRect(0, 0, c.width, c.height);
  if (advance != null) { g.fillStyle = "#242c38"; g.fillRect(0, 0, advance * scale, c.height); }
  g.fillStyle = "#e6e9ef";
  rows.forEach((bits, y) => {
    for (let x = 0; x < W; x++) if (bits >> (7 - x) & 1) g.fillRect(x*scale, y*scale, scale, scale);
  });
  return c;
}

const CATS = {
  thai:   c => c >= "ก" && c <= "ฮ",
  vowel:  c => c >= "ฯ" && c <= "๛",
  upper:  c => c >= "A" && c <= "Z",
  lower:  c => c >= "a" && c <= "z",
  digit:  c => c >= "0" && c <= "9",
  punct:  c => !/[฀-๿A-Za-z0-9]/.test(c),
};

/* ---- glyph list --------------------------------------------------------- */

function renderTabs() {
  $("tabs").innerHTML = "";
  for (const name of [...Object.keys(CATS), "marks", "icons"]) {
    const b = document.createElement("button");
    b.textContent = name;
    b.className = S.tab === name ? "on" : "";
    b.onclick = () => { S.tab = name; renderTabs(); renderList(); };
    $("tabs").append(b);
  }
}

const KIND_OF_TAB = t => t === "marks" ? "mark" : t === "icons" ? "icon" : "base";
const SOURCE = k => k === "mark" ? S.st.marks : k === "icon" ? S.st.icons : S.st.bases;

function renderList() {
  const q = $("search").value.trim().toLowerCase();
  const list = $("list"); list.innerHTML = "";
  const kind = KIND_OF_TAB(S.tab), src = SOURCE(kind);
  const keys = Object.keys(src).filter(c =>
      (kind !== "base" || CATS[S.tab](c)) && (!q || c.toLowerCase().includes(q)));
  for (const c of keys) {
    const cell = document.createElement("div");
    cell.className = "cell" + (S.char === c && S.kind === kind ? " sel" : "")
                   + (kind === "base" && S.st.hand_drawn.includes(c) ? " hand" : "");
    cell.title = kind === "icon"
      ? `<${c}>  advance ${src[c].advance}` + (src[c].redrawn ? "  (redrawn)" : "")
      : c + "  U+" + c.codePointAt(0).toString(16).toUpperCase();
    cell.append(draw(kind === "mark" ? markCell(src[c]) : src[c].rows, 3,
                     kind === "mark" ? null : src[c].advance));
    cell.onclick = () => pick(kind, c);
    list.append(cell);
  }
  if (!keys.length) list.textContent = "nothing here";
}

/* AiL+AiR, SpL+SpR, MAP_L+MAP_R are each one picture across two cells. */
function partnerOf(name) {
  if (!S.st.icons) return null;
  if (name.endsWith("L") && S.st.icons[name.slice(0, -1) + "R"])
    return { side: "right", name: name.slice(0, -1) + "R" };
  if (name.endsWith("R") && S.st.icons[name.slice(0, -1) + "L"])
    return { side: "left", name: name.slice(0, -1) + "L" };
  return null;
}

function paintMini(el, rows) {
  el.innerHTML = "";
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < W; x++) {
    const d = document.createElement("div");
    if (rows[y] >> (7 - x) & 1) d.className = "lit";
    el.append(d);
  }
}

function showPartner() {
  const p = S.kind === "icon" ? partnerOf(S.char) : null;
  for (const side of ["L", "R"]) {
    const box = $("p" + side), label = $("p" + side + "name");
    const on = p && p.side === (side === "L" ? "left" : "right");
    box.style.display = on ? "" : "none";
    label.textContent = on ? `<${p.name}>` : "";
    if (on) paintMini(box, S.st.icons[p.name].rows);
  }
  $("pGname").textContent = S.kind === "icon" ? `<${S.char}>` : "";
}

/* a mark lives left-aligned in its sprite; show it where it sits in the cell */
function markCell(m) {
  const rows = Array(ROWS).fill(0);
  (m.sprite || []).forEach((bits, i) => { if (m.y + i < ROWS) rows[m.y + i] = bits; });
  return rows;
}

/* ---- the pixel grid ----------------------------------------------------- */

let paintMode = null;
function buildGrid() {
  const g = $("grid"); g.innerHTML = "";
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < W; x++) {
    const d = document.createElement("div");
    d.dataset.x = x; d.dataset.y = y;
    d.onmousedown = e => { e.preventDefault();
      paintMode = !(S.rows[y] >> (7 - x) & 1); set(x, y, paintMode); };
    d.onmouseenter = () => { if (paintMode !== null) set(x, y, paintMode); };
    g.append(d);
  }
  document.addEventListener("mouseup", () => { if (paintMode !== null) { paintMode = null; commit(); } });
}

function set(x, y, on) {
  const bit = 1 << (7 - x);
  const next = on ? (S.rows[y] | bit) : (S.rows[y] & ~bit);
  if (next === S.rows[y]) return;
  S.rows[y] = next;
  paintGrid();
}

function paintGrid() {
  const adv = S.kind === "mark" ? 8 : (S.advance ?? 8);
  const base = S.kind === "mark" && S.sel ? S.sel : null;
  [...$("grid").children].forEach(d => {
    const x = +d.dataset.x, y = +d.dataset.y;
    const lit = S.rows[y] >> (7 - x) & 1;
    const under = base && (base.rows[y] >> (7 - x) & 1);
    d.className = lit ? "lit" : under ? "base" : (x < adv ? "" : "bearing");
    if (y === 12) d.className += " baseline";
  });
  showMetrics();
  refreshClusters();
  refreshText();
}

function inkBox(rows) {
  const used = rows.filter(r => r);
  if (!used.length) return { left: 0, ink: 0, top: 0 };
  let left = 8, right = -1, top = rows.findIndex(r => r);
  for (const v of used) for (let b = 0; b < 8; b++)
    if (v >> (7 - b) & 1) { left = Math.min(left, b); right = Math.max(right, b); }
  return { left, ink: right - left + 1, top };
}

function showMetrics() {
  const box = inkBox(S.rows);
  const [lo, hi] = S.st.advance_range;
  const auto = Math.min(Math.max(box.ink + 1, lo), hi);
  $("metrics").innerHTML =
    `<span>left</span><b>${box.left}</b><span>ink</span><b>${box.ink}</b>` +
    `<span>top</span><b>${box.top}</b>` +
    (S.kind === "base" ? `<span>auto advance</span><b>${auto}</b>` :
     `<span>rows</span><b>${box.top}..${box.top + Math.max(0, S.rows.filter(r=>r).length - 1)}</b>`);
}

/* ---- selection ---------------------------------------------------------- */

function pick(kind, char) {
  S.kind = kind; S.char = char; S.undo = [];
  const src = SOURCE(kind)[char];
  S.rows = kind === "mark" ? markCell(src) : src.rows.slice();
  S.advance = kind === "mark" ? null : src.advance;
  S.span = kind === "icon" ? (src.cell_span || 1) : 1;
  S.dx = kind === "mark" ? (src.dx || 0) : 0;
  S.sel = kind === "mark" ? S.st.bases["ก"] : null;   // preview a mark over ก
  $("title").textContent = kind === "icon"
    ? `icon  <${char}>` + (src.redrawn ? "   (redrawn)" : "")
    : `${kind}  ${char}  U+${char.codePointAt(0).toString(16).toUpperCase()}`
      + (S.st.hand_drawn.includes(char) ? "   (hand-drawn)" : "");
  renderControls();
  renderTabs(); renderList(); showPartner(); paintGrid(); renderOverride();
  $("hint").textContent = kind === "base"
    ? "left / ink / top are derived from the pixels on every stroke. advance is yours."
    : kind === "mark"
    ? "sprite / height / width / y are derived from the pixels. dx is your nudge; the grey shape is ก for reference."
    : "fixed artwork — the bitmap is the whole glyph, nothing is composed on top. "
      + "Saving restamps its sha256 and marks it redrawn, so the file stops claiming "
      + "it still matches the manifest it was migrated from.";
}

function renderControls() {
  const c = $("controls"); c.innerHTML = "";
  if (S.kind === "base") {
    c.innerHTML = `<label>advance <input id="adv" type="number" min="${S.st.advance_range[0]}"
      max="${S.st.advance_range[1]}" value="${S.advance}" style="width:56px"></label>
      <button id="autoadv">auto</button>`;
    $("adv").oninput = () => { S.advance = +$("adv").value; paintGrid(); commit(); };
    $("autoadv").onclick = () => {
      const [lo, hi] = S.st.advance_range;
      S.advance = Math.min(Math.max(inkBox(S.rows).ink + 1, lo), hi);
      $("adv").value = S.advance; paintGrid(); commit();
    };
  } else if (S.kind === "icon") {
    c.innerHTML = `<label>advance <input id="adv" type="number" min="0" max="8"
      value="${S.advance}" style="width:56px"></label>
      <label>cell span <input id="span" type="number" min="1" max="4"
      value="${S.span}" style="width:52px"></label>`;
    $("adv").oninput = () => { S.advance = +$("adv").value; paintGrid(); commit(); };
    $("span").oninput = () => { S.span = +$("span").value; commit(); };
  } else if (S.kind === "mark") {
    c.innerHTML = `<label>dx <input id="dx" type="number" min="-4" max="4" value="${S.dx}"
      style="width:52px"></label> <label>over <select id="over"></select></label>`;
    $("dx").oninput = () => { S.dx = +$("dx").value; commit(); };
    const sel = $("over");
    for (const ch of Object.keys(S.st.bases).filter(CATS.thai))
      sel.append(new Option(ch, ch));
    sel.value = "ก";
    sel.onchange = () => { S.sel = S.st.bases[sel.value]; paintGrid(); };
  }
}

async function commit() {
  if (!S.char) return;
  S.undo.push({ rows: S.rows.slice(), advance: S.advance, dx: S.dx });
  if (S.undo.length > 60) S.undo.shift();
  const path = { mark: "/api/mark", icon: "/api/icon", base: "/api/base" }[S.kind];
  const body = S.kind === "mark" ? { char: S.char, rows: S.rows, dx: S.dx }
    : S.kind === "icon" ? { name: S.char, rows: S.rows, advance: S.advance,
                            cell_span: S.span }
    : { char: S.char, rows: S.rows, advance: S.advance };
  const r = await api(path, body);
  SOURCE(S.kind)[S.char] = r.entry;
  markDirty(true);
  renderList(); showPartner(); refreshClusters(); refreshText();
}

function markDirty(on) { $("dirty").textContent = on ? "unsaved changes" : ""; }

/* ---- cluster previews --------------------------------------------------- */

let clusterTimer = null;
function refreshClusters() {
  clearTimeout(clusterTimer);
  clusterTimer = setTimeout(async () => {
    const box = $("clusters"); if (!S.char) return;
    const tokens = S.kind === "icon"
      ? [partnerOf(S.char) && partnerOf(S.char).side === "left"
          ? "icon:" + partnerOf(S.char).name : null,
         "icon:" + S.char,
         partnerOf(S.char) && partnerOf(S.char).side === "right"
          ? "icon:" + partnerOf(S.char).name : null].filter(Boolean)
      : S.kind === "base"
      ? (S.st.clusters[S.char] || [])
      : Object.keys(S.st.bases).filter(CATS.thai)
          .map(b => "cluster:" + b + S.char)
          .filter(t => (S.st.clusters[t.split(":")[1][0]] || []).includes(t));
    if (!tokens.length) { box.innerHTML = "<span class='note'>no cluster in the manifest uses this</span>"; return; }
    const { glyphs } = await api("/api/compose", { tokens });
    box.innerHTML = "";
    for (const g of glyphs) {
      const el = document.createElement("div");
      el.className = "pv" + (g.error ? " err" : "") + (S.st.overrides[g.token] ? " ovr" : "");
      el.title = g.token + (g.error ? "  " + g.error : `  adv ${g.advance}  ${g.source}`);
      el.append(g.error ? document.createTextNode("!") : draw(g.rows, 3, g.advance, g.cell_span));
      el.onclick = () => selectOverride(g);
      box.append(el);
    }
  }, 40);
}

/* ---- text strip --------------------------------------------------------- */

let textTimer = null;
function refreshText() {
  clearTimeout(textTimer);
  textTimer = setTimeout(async () => {
    const text = $("text").value;
    const { glyphs } = await api("/api/compose", { text });
    const win = S.st.windows[$("window").value];
    const scale = 3, limit = win ? win.width : 240;
    const c = document.createElement("canvas");
    c.width = Math.max(limit + 2, 40) * scale; c.height = ROWS * scale;
    const g = c.getContext("2d");
    g.fillStyle = "#0c0e12"; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = "#171b22"; g.fillRect(limit * scale, 0, c.width, c.height);
    let pen = 0, over = false;
    g.fillStyle = "#e6e9ef";
    for (const gl of glyphs) {
      if (gl.error) { over = true; continue; }
      if (pen + gl.advance > limit) { over = true; g.fillStyle = "#e06c75"; }
      gl.rows.forEach((bits, y) => {
        for (let x = 0; x < W; x++) if (bits >> (7 - x) & 1)
          g.fillRect((pen + x) * scale, y * scale, scale, scale);
      });
      pen += gl.advance;
    }
    g.strokeStyle = "#3a4250"; g.beginPath();
    g.moveTo(limit * scale + .5, 0); g.lineTo(limit * scale + .5, c.height); g.stroke();
    $("strip").innerHTML = ""; $("strip").append(c);
    const bytes = glyphs.reduce((n, gl) =>
      n + ((S.st.direct.indexOf(gl.token) >= 0) ? 1 : 2), 0);
    $("fit").innerHTML = `${pen}px of ${limit}px &middot; ${glyphs.length} glyphs &middot; `
      + `${bytes} bytes  <span class="${over ? "bad" : "good"}">`
      + (over ? "over the window — the engine drops the glyph that crosses" : "fits") + "</span>";
  }, 60);
}

/* ---- overrides ---------------------------------------------------------- */

let ovrToken = null;
function selectOverride(g) { ovrToken = g.token; renderOverride(g); }

function renderOverride(g) {
  const box = $("ovr");
  if (!ovrToken) { box.innerHTML = "<span class='note'>click a cluster above to override its bitmap</span>"; return; }
  const cur = S.st.overrides[ovrToken];
  box.innerHTML = `<div class="note">${ovrToken}${cur ? " — overridden" : ""}</div>
    <div class="row"><input id="oreason" placeholder="reason" style="flex:1"
      value="${cur ? cur.reason.replace(/"/g, "&quot;") : ""}"></div>
    <div class="row"><input id="osample" placeholder="regression sample" style="flex:1"
      value="${cur ? cur.sample.replace(/"/g, "&quot;") : ""}"></div>
    <div class="row"><button id="opush">Take from the grid</button>
      <button id="odrop" ${cur ? "" : "disabled"}>Remove</button></div>
    <div class="note">an override needs both fields; the atlas compiler refuses one without them</div>`;
  $("opush").onclick = async () => {
    await api("/api/override", { token: ovrToken, rows: S.rows, advance: S.advance,
      reason: $("oreason").value, sample: $("osample").value });
    S.st.overrides = (await api("/api/state")).overrides;
    markDirty(true); renderOverride(); refreshClusters();
  };
  $("odrop").onclick = async () => {
    await api("/api/override", { token: ovrToken, rows: null });
    delete S.st.overrides[ovrToken];
    markDirty(true); renderOverride(); refreshClusters();
  };
}

/* ---- boot --------------------------------------------------------------- */

async function boot() {
  S.st = await api("/api/state");
  if (S.st.rom_note) note("no clean ROM: stock-font glyphs will not preview", "warn");
  buildGrid(); renderTabs(); renderList();

  const sel = $("window");
  for (const name of Object.keys(S.st.windows)) sel.append(new Option(
    `${name} ${S.st.windows[name].width}px`, name));
  sel.onchange = refreshText;
  $("text").oninput = refreshText;
  $("search").oninput = renderList;

  $("worst").innerHTML = "";
  for (const [cluster, dist] of S.st.worst.slice(0, 30)) {
    const b = document.createElement("button");
    b.textContent = `${cluster} ${dist}`;
    b.title = `${dist}px from the game's own drawing`;
    b.onclick = () => { pick("base", cluster[0]); ovrToken = "cluster:" + cluster;
                        $("text").value = cluster; refreshText(); renderOverride(); };
    $("worst").append(b);
  }

  document.querySelectorAll("[data-nudge]").forEach(b => b.onclick = () => {
    const [dx, dy] = b.dataset.nudge.split(",").map(Number);
    let rows = S.rows.slice();
    if (dy) rows = dy > 0 ? [0, ...rows.slice(0, -1)] : [...rows.slice(1), 0];
    S.rows = rows.map(r => dx > 0 ? (r >> dx) & 0xFF : (r << -dx) & 0xFF);
    paintGrid(); commit();
  });
  $("clear").onclick = () => { S.rows = Array(ROWS).fill(0); paintGrid(); commit(); };
  $("undo").onclick = () => {
    S.undo.pop();
    const prev = S.undo[S.undo.length - 1]; if (!prev) return;
    S.rows = prev.rows.slice(); S.advance = prev.advance; S.dx = prev.dx;
    renderControls(); paintGrid(); commit();
  };
  $("save").onclick = async () => {
    const r = await api("/api/save", {});
    markDirty(false); note("wrote " + r.written.join(", "), "good");
  };
  let armed = null;                       // revert asks twice, in the button itself
  $("revert").onclick = async () => {
    if (!armed) {
      $("revert").textContent = "Revert — sure?"; $("revert").classList.add("on");
      armed = setTimeout(() => { armed = null; $("revert").textContent = "Revert";
                                 $("revert").classList.remove("on"); }, 4000);
      return;
    }
    clearTimeout(armed); armed = null;
    $("revert").textContent = "Revert"; $("revert").classList.remove("on");
    await api("/api/revert", {}); S.st = await api("/api/state");
    markDirty(false); if (S.char) pick(S.kind, S.char); renderList();
    note("reverted to what is on disk");
  };
  $("rebuild").onclick = async () => {
    note("building…"); const r = await api("/api/rebuild", {});
    note(r.out.trim(), r.ok ? "good" : "bad");
  };
  markDirty(S.st.dirty);
  pick("base", "ก");
}
boot();
</script>
